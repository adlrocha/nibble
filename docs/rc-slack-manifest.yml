# Slack app manifest for `nibble rc` (Slack remote control).
# Create the app at https://api.slack.com/apps → Create New App →
# From a manifest, pick your workspace, and paste this file.
# With more than one machine, give each app its own name and slash command:
# `nibble rc manifest --name nibble-laptop` (see docs/rc.md).
display_information:
  name: nibble
  description: Talk to your nibble agent sessions from Slack.
  background_color: "#1f2328"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: nibble
    always_online: true
  agent_view:
    agent_description: >-
      Your nibble coding agents. Send /nibble-rc from a Claude Code or pi
      session to continue it here, or start a new one with /nibble.
    suggested_prompts:
      - title: New session
        message: Start a new session
  slash_commands:
    - command: /nibble
      description: Start a new agent session, or list the ones in Slack
      usage_hint: "[list]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - assistant:write
      - chat:write
      - commands
      - im:history
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - agent_session_stopped
      - agent_session_title_changed
      - app_context_changed
      - app_home_opened
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
