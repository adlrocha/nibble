name: Nibble Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    # Same-repository, non-draft PRs, plus @nibble-review mentions from people with write access.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@nibble-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nibble-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    steps:
      # Pinned to the full commit SHA of a release (mutable tags on an action holding
      # write permissions + secrets are a supply-chain risk). Bump deliberately.
      # Requires the OPENCODE_API_KEY repository secret — see README before first run.
      - uses: adlrocha/nibble-review@e371349d97c6750d313c75a4b11f834aea6aca63 # v1.1.1
        with:
          land: "true"
          api-key: ${{ secrets.OPENCODE_API_KEY }}
