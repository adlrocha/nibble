# Read by nibble-review from the default branch, and by `nibble land` and `nibble sdlc`.
# `nibble sdlc runbook` explains every setting. `mode = "off"` stops land here.
[land]
mode = "enforce"
profile = "side-project"
authors = ["adlrocha"]
required_checks = ["install", "review"]
always_human = ["src/land", "src/sdlc", "src/sandbox", "skills/nibble-sdlc"]

[land.ask_when]
authority = "It widens what an agent, a Slack message, or a schedule may do, or what it can reach on the host"
product = "It removes or replaces a feature people use"
